name: Generate Snake Animation

on:
  # Regenerate every day so the snake reflects fresh contributions.
  schedule:
    - cron: "17 3 * * *"
  # Allow running by hand from the Actions tab.
  workflow_dispatch:
  # Regenerate on every push to main.
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Build the contribution snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # The default github.token acts as github-actions[bot], which GraphQL
          # only ever shows PUBLIC contributions - the "Include private
          # contributions on my profile" setting does not apply to it. To make
          # the snake eat private contributions too, add a repo secret named
          # SNAKE_TOKEN holding a PAT with the read:user scope. Falls back to
          # the default token (public contributions only) when unset.
          github_token: ${{ secrets.SNAKE_TOKEN || github.token }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=#58A6FF&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353

      - name: Push the generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
